<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>תחנת המשטרה — שלב 1 (ריג 2D חי)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0e1726;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
#viewport{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));background:#1b2a44;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.6);border-radius:6px}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .32s ease;overflow:hidden}
.scene.active{opacity:1;pointer-events:auto}
#hq-camera{position:absolute;inset:0;transform-origin:51.4% 50.5%;transition:transform .52s cubic-bezier(.22,1,.36,1)}
#hq-camera.zoom-jail{transform:scale(2.08) translate(0.5%, 3.5%)}
.bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}

.hotspot{position:absolute;cursor:pointer;z-index:12}
.prop,.entity{position:absolute;transform-origin:50% 95%;cursor:grab;will-change:transform,left,top}
.prop.dragging,.entity.dragging{cursor:grabbing;z-index:90!important;filter:drop-shadow(0 14px 12px rgba(0,0,0,.45))}
.entity img,.entity canvas,.prop img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}

@keyframes toyHop{0%,100%{transform:translate(-50%,-100%) scale(1,1) rotate(0deg)}35%{transform:translate(-50%,-107%) scale(.95,1.06) rotate(-3deg)}70%{transform:translate(-50%,-101%) scale(1.04,.96) rotate(3deg)}}
@keyframes idleBreath{0%,100%{transform:translate(-50%,-100%) scale(1,1)}50%{transform:translate(-50%,-100%) scale(1.015,.985)}}
@keyframes dangleSway{0%,100%{transform:translate(-50%,-72%) scale(1.08) rotate(-7deg)}50%{transform:translate(-50%,-72%) scale(1.08) rotate(7deg)}}
@keyframes landBounce{0%{transform:translate(-50%,-100%) scale(1.14,.86)}55%{transform:translate(-50%,-104%) scale(.95,1.05)}100%{transform:translate(-50%,-100%) scale(1,1)}}
@keyframes talentPop{0%,100%{transform:translate(-50%,-100%) scale(1) rotate(0deg)}30%{transform:translate(-50%,-112%) scale(1.1) rotate(-8deg)}65%{transform:translate(-50%,-106%) scale(1.06) rotate(8deg)}}
@keyframes pulseRing{0%{transform:translate(-50%,-50%) scale(.7);opacity:.95}100%{transform:translate(-50%,-50%) scale(2.1);opacity:0}}
@keyframes heliHover{0%,100%{transform:translate(-50%,-100%) translateY(0)}50%{transform:translate(-50%,-100%) translateY(-10%)}}
@keyframes sirenFlash{0%,49%{opacity:.9;background:radial-gradient(circle,#ff2d55 0%,rgba(255,45,85,0) 70%)}50%,100%{opacity:.9;background:radial-gradient(circle,#1ea7ff 0%,rgba(30,167,255,0) 70%)}}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.6);opacity:1}100%{transform:translate(-50%,-54px) scale(1.25);opacity:0}}

.entity{transform:translate(-50%,-100%)}
.entity.idle{animation:idleBreath 2.4s ease-in-out infinite}
.entity.walking{animation:toyHop .32s ease-in-out infinite}
.entity.dragging{animation:dangleSway .38s ease-in-out infinite!important}
.entity.landed{animation:landBounce .34s ease-out}
.entity.talent{animation:talentPop .55s ease-in-out 2}
.entity.flip img,.entity.flip canvas{transform:scaleX(-1)}

/* Rigged cop uses its own real skeletal animation inside canvas — no fake CSS wobble! */
.entity.rigged{animation:none!important}
.entity.rigged.dragging{transform:translate(-50%,-78%) scale(1.04)!important;animation:none!important}
.entity.rigged.landed{animation:landBounce .28s ease-out!important}

.prop{transform:translate(-50%,-100%)}
.prop.dragging{transform:translate(-50%,-68%) scale(1.12) rotate(-5deg)!important}

.cell-wrap{position:absolute;top:38.8%;height:23.8%;width:12.1%;overflow:hidden;pointer-events:none;z-index:26}
.cell-bars{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;transition:transform .42s cubic-bezier(.22,1,.36,1);pointer-events:auto;cursor:pointer}
.cell-wrap.open .cell-bars{transform:translateY(-86%)}
.cell-dark{position:absolute;inset:0;background:rgba(8,14,28,.78);opacity:0;transition:opacity .35s;pointer-events:none;z-index:24}
.cell-dark.on{opacity:1}
.cell-eyes{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;gap:8px;opacity:0;transition:opacity .35s}
.cell-dark.on .cell-eyes{opacity:1}
.cell-eyes span{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 8px #7ef9ff;position:relative;display:block}
.cell-eyes span::after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:#111;top:2px;left:3px}

.cell-switch{position:absolute;top:51%;width:2.6%;height:6.5%;transform:translate(-50%,-50%);z-index:45;cursor:pointer;background:#1e3557;border:2px solid #7fe7ff;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.cell-switch .led{width:62%;aspect-ratio:1;border-radius:50%;transition:all .2s}
.cell-switch .led.red{background:#ff4b5c;box-shadow:0 0 6px #ff4b5c}
.cell-switch .led.green{background:#2bd97c;opacity:.3}
.cell-switch.open .led.red{opacity:.3;box-shadow:none}
.cell-switch.open .led.green{opacity:1;box-shadow:0 0 7px #2bd97c}

#alert-ping{position:absolute;left:50.8%;top:70.8%;width:5.5%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:42;cursor:pointer}
#alert-ping .ring{position:absolute;left:50%;top:50%;width:100%;height:100%;border-radius:50%;border:3px solid #ff6b2b;animation:pulseRing 1.4s ease-out infinite}
#alert-ping .ring:nth-child(2){animation-delay:.7s}
#alert-ping .dot{position:absolute;left:50%;top:50%;width:38%;height:38%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff3a0,#ff551a);box-shadow:0 0 12px #ff551a}
#alert-ping.calm{opacity:.35}
#alert-ping.calm .ring{animation:none;opacity:0}

#hq-heli{left:64.5%;top:35.2%;width:21%;z-index:20;cursor:pointer}
#hq-heli.flying{animation:heliHover .7s ease-in-out 2}
#hq-suv{left:9.2%;top:90.5%;width:18.5%;z-index:25;cursor:pointer}
.siren-glow{position:absolute;left:46%;top:18%;width:38%;aspect-ratio:1;border-radius:50%;pointer-events:none;opacity:0}
.siren-on .siren-glow{animation:sirenFlash .34s linear infinite}

.hud-btn{position:absolute;z-index:120;width:clamp(40px,5.6%,56px);aspect-ratio:1;border-radius:50%;border:3px solid #fff;background:linear-gradient(180deg,#64b8ff 0%,#2575d6 100%);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s;color:#fff;font-size:20px}
.hud-btn:active{transform:scale(.9)}
.hud-btn svg{width:58%;height:58%;fill:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
#btn-home{top:2.8%;left:1.8%}
#btn-settings{top:2.8%;right:1.8%}
#btn-zoom-jail{top:2.8%;left:8.6%;background:linear-gradient(180deg,#38d9ff 0%,#0f82c8 100%)}
#btn-lights{top:2.8%;left:15.4%;background:linear-gradient(180deg,#ffd452 0%,#e08a00 100%);display:none}
#btn-wanted{top:2.8%;right:8.6%;background:linear-gradient(180deg,#ff9a3c 0%,#d95514 100%)}
#btn-cop-swap{bottom:3.2%;left:1.8%;width:clamp(44px,6.2%,62px);background:linear-gradient(180deg,#52d681 0%,#1f9d55 100%)}
#btn-cop-swap img{width:84%;height:84%;object-fit:contain;border-radius:50%}

/* Quick action bar for testing the rigged hero cop directly (Wave / Hold Prop) */
#rig-actions{position:absolute;bottom:3.2%;left:9.4%;z-index:118;display:flex;gap:8px}
.rig-pill{padding:7px 13px;border-radius:999px;border:2px solid #fff;background:rgba(15,34,64,.88);color:#fff;font-size:clamp(11px,1.3vw,14px);font-weight:700;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.35);display:flex;align-items:center;gap:5px;transition:transform .12s}
.rig-pill:active{transform:scale(.92)}

#case-pill{position:absolute;top:3%;left:50%;transform:translateX(-50%);z-index:115;background:rgba(15,28,50,.86);border:2px solid #5bd4ff;color:#fff;padding:6px 16px;border-radius:999px;font-size:clamp(12px,1.5vw,16px);font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap}
#case-pill .badge{width:11px;height:11px;border-radius:50%;background:#ff5a26;box-shadow:0 0 8px #ff5a26;display:inline-block}
#case-pill.done .badge{background:#2bd97c;box-shadow:0 0 8px #2bd97c}

/* Heist scene */
#heist-suv{left:17%;top:88%;width:24%;z-index:25}
#heist-cop{left:36%;top:86%;width:17.5%;z-index:32}
#heist-k9{left:27%;top:87%;width:14%;z-index:31;cursor:pointer}
#heist-thief{left:74%;top:86%;width:17%;z-index:30;cursor:pointer}
#heist-bag{left:80%;top:86%;width:10%;z-index:29;pointer-events:none}
#heist-cuffs-btn{position:absolute;left:56%;top:48%;width:14%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.9);z-index:55;cursor:pointer;border-radius:50%;background:radial-gradient(circle,rgba(255,244,180,.95) 0%,rgba(255,196,46,.35) 68%,rgba(255,196,46,0) 75%);border:3px solid #ffe066;box-shadow:0 0 24px rgba(255,214,70,.8);display:flex;align-items:center;justify-content:center;transition:transform .2s,opacity .2s}
#heist-cuffs-btn:active{transform:translate(-50%,-50%) scale(.82)}
#heist-cuffs-btn img{width:76%;height:76%;object-fit:contain;pointer-events:none}
#heist-cuffs-btn.locked{opacity:.38;filter:grayscale(.5);transform:translate(-50%,-50%) scale(.82)}
.dropped-gem{position:absolute;width:6.5%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:48;cursor:pointer;filter:drop-shadow(0 4px 8px rgba(0,220,255,.7));transition:transform .2s,opacity .2s}
.heist-action-bar{position:absolute;bottom:3.5%;right:2.5%;z-index:110;display:flex;gap:10px}
.action-fab{width:clamp(48px,6.5%,66px);aspect-ratio:1;border-radius:50%;border:3px solid #fff;background:linear-gradient(180deg,#ffae3d 0%,#e06810 100%);box-shadow:0 4px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:24px;color:#fff}

/* Mugshot scene */
#mug-thief{left:22%;top:83%;width:22%;z-index:30}
#mug-cop{left:45%;top:84%;width:17%;z-index:28}
#mug-k9{left:55%;top:85%;width:12%;z-index:29}
#mug-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:95;transition:opacity .08s}
#mug-cam-btn{position:absolute;left:22%;bottom:5%;transform:translateX(-50%);z-index:65;padding:10px 22px;border-radius:999px;border:3px solid #fff;background:linear-gradient(180deg,#ffca3a 0%,#eb7a00 100%);color:#fff;font-size:clamp(14px,1.8vw,20px);font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px}
#mug-done-btn{position:absolute;right:3%;bottom:4.5%;z-index:65;width:clamp(54px,7.2%,72px);aspect-ratio:1;border-radius:50%;border:3px solid #fff;background:linear-gradient(180deg,#4ee381 0%,#159e48 100%);box-shadow:0 6px 16px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;cursor:pointer}
#mug-done-btn svg{width:58%;height:58%;fill:#fff}
.polaroid{position:absolute;width:9.2%;aspect-ratio:.82;background:#fff;padding:4px 4px 12px;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.38);transform:translate(-50%,-50%) rotate(var(--rot,-3deg));transition:all .65s cubic-bezier(.22,1,.36,1);z-index:35;cursor:pointer}
.polaroid .pic{width:100%;height:78%;background:linear-gradient(180deg,#d8f0ff,#9ad0ff);border-radius:2px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.polaroid .pic img{width:118%;height:118%;object-fit:contain;transform:translateY(8%)}
.polaroid .pin{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:#ff3b30;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.polaroid .lbl{font-size:clamp(8px,.9vw,11px);font-weight:800;color:#223;text-align:center;margin-top:2px;white-space:nowrap;overflow:hidden}
.polaroid.empty{background:rgba(255,255,255,.22);border:2px dashed rgba(255,255,255,.55);box-shadow:none}
.polaroid.empty .pic{background:transparent}
.polaroid.empty .lbl{color:#fff}

.fx{position:absolute;pointer-events:none;z-index:100;font-size:clamp(18px,2.4vw,28px);animation:floatUp .85s ease-out forwards}

#settings-modal{position:absolute;inset:0;background:rgba(10,18,34,.68);z-index:200;display:none;align-items:center;justify-content:center}
#settings-modal.open{display:flex}
.modal-card{background:#fff;border-radius:18px;padding:20px 24px;width:min(320px,84%);text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.45);color:#1d2b44}
.modal-card h3{font-size:18px;margin-bottom:14px}
.modal-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.m-btn{padding:10px 16px;border-radius:12px;border:none;font-weight:700;font-size:14px;cursor:pointer;background:#e8f1ff;color:#1d4e9e}
.m-btn.primary{background:#2575d6;color:#fff}
.m-btn.danger{background:#ffe5e8;color:#c92a3e}

#rotate-hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:300;background:rgba(15,28,50,.9);color:#fff;border:1px solid #5bd4ff;border-radius:999px;padding:6px 14px;font-size:12px;display:none;align-items:center;gap:6px;white-space:nowrap}
@media (orientation:portrait) and (max-width:640px){#rotate-hint{display:flex}}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <!-- ================= SCENE 1: HQ CUTAWAY ================= -->
    <div id="scene-hq" class="scene active">
      <div id="hq-camera">
        <img class="bg-img" id="img-bg-hq" alt="מפקדה">

        <div class="hotspot" id="elev-f2" style="left:15.5%;top:42%;width:11%;height:20%" title="מעלית קומה 2"></div>
        <div class="hotspot" id="elev-f1" style="left:15.5%;top:65%;width:11%;height:20%" title="מעלית קומה 1"></div>

        <div id="alert-ping" title="קריאת חירום חדשה">
          <div class="ring"></div><div class="ring"></div><div class="dot"></div>
        </div>

        <div class="hotspot" id="hq-wanted-hotspot" style="left:69.5%;top:66%;width:13.5%;height:14%" title="לוח מבוקשים"></div>
        <div class="hotspot" id="walk-f1" style="left:2%;top:80%;width:96%;height:19%;z-index:8"></div>
        <div class="hotspot" id="walk-f2" style="left:2%;top:48%;width:96%;height:14%;z-index:8"></div>

        <div class="prop" id="hq-heli"><img id="img-hq-heli" alt="מסוק"></div>
        <div class="prop" id="hq-suv"><img id="img-hq-suv" alt="ניידת"><div class="siren-glow"></div></div>

        <div id="jail-entities"></div>
        <div class="cell-dark" id="dark-0" style="left:32.4%;top:38.8%;width:12.1%;height:23.8%"><div class="cell-eyes"><span></span><span></span></div></div>
        <div class="cell-dark" id="dark-1" style="left:45.4%;top:38.8%;width:12.1%;height:23.8%"><div class="cell-eyes"><span></span><span></span></div></div>
        <div class="cell-dark" id="dark-2" style="left:58.4%;top:38.8%;width:12.1%;height:23.8%"><div class="cell-eyes"><span></span><span></span></div></div>

        <div class="cell-wrap" id="bars-0" style="left:32.4%"><img class="cell-bars" id="img-bars-0" alt="סורגים"></div>
        <div class="cell-wrap" id="bars-1" style="left:45.4%"><img class="cell-bars" id="img-bars-1" alt="סורגים"></div>
        <div class="cell-wrap" id="bars-2" style="left:58.4%"><img class="cell-bars" id="img-bars-2" alt="סורגים"></div>

        <div class="cell-switch" id="sw-0" style="left:44.9%" title="פתח/סגור תא 1"><div class="led red"></div><div class="led green"></div></div>
        <div class="cell-switch" id="sw-1" style="left:57.9%" title="פתח/סגור תא 2"><div class="led red"></div><div class="led green"></div></div>
        <div class="cell-switch" id="sw-2" style="left:70.9%" title="פתח/סגור תא 3"><div class="led red"></div><div class="led green"></div></div>

        <div class="prop" id="prop-donuts" style="left:47%;top:86%;width:6.2%;z-index:36"><img id="img-donuts" alt="דונאטס"></div>
        <div class="prop" id="prop-tray" style="left:75.5%;top:91.5%;width:7.2%;z-index:36"><img id="img-tray" alt="מגש אוכל"></div>

        <!-- JOINTED 2D SKELETAL RIG HERO COP -->
        <div class="entity rigged" id="hq-cop-m" style="left:41%;top:92%;width:13.2%;aspect-ratio:1;z-index:35">
          <canvas id="canvas-cop-m" width="512" height="512"></canvas>
        </div>
        <div class="entity idle" id="hq-cop-f" style="left:60%;top:92%;width:12.2%;z-index:34"><img id="img-cop-f" alt="שוטרת"></div>
        <div class="entity idle" id="hq-k9" style="left:83.5%;top:61%;width:10.5%;z-index:33"><img id="img-k9" alt="כלב משטרה"></div>
      </div>

      <div id="case-pill"><span class="badge"></span><span id="case-pill-txt">קריאת חירום בחנות התכשיטים!</span></div>
      <button class="hud-btn" id="btn-zoom-jail" title="זום לכלא">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1 0 14 15.5l.27.28v.79L20 21.5 21.5 20l-6-6zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      </button>
      <button class="hud-btn" id="btn-lights" title="אור / חושך בכלא">
        <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19a7 7 0 0 0-4 12.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26A7 7 0 0 0 12 2z"/></svg>
      </button>
      <button class="hud-btn" id="btn-wanted" title="לוח מבוקשים">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01L12 2z"/></svg>
      </button>
      <button class="hud-btn" id="btn-cop-swap" title="החלף שוטר/שוטרת"><img id="img-swap-cop" alt="החלף שוטר"></button>
      <div id="rig-actions">
        <button class="rig-pill" id="btn-cop-wave">👋 נפנוף</button>
        <button class="rig-pill" id="btn-cop-prop">🍩 החזק חפץ</button>
      </div>
    </div>

    <!-- ================= SCENE 2: OUTDOOR HEIST ================= -->
    <div id="scene-heist" class="scene">
      <img class="bg-img" id="img-bg-heist" alt="חנות תכשיטים">
      <div id="heist-pill" style="position:absolute;top:3%;left:50%;transform:translateX(-50%);z-index:115;background:rgba(15,28,50,.86);border:2px solid #ffe066;color:#fff;padding:6px 16px;border-radius:999px;font-size:clamp(12px,1.5vw,16px);font-weight:700;white-space:nowrap">תפסו את הגנב!</div>
      <div class="prop siren-on" id="heist-suv"><img id="img-heist-suv" alt="ניידת"><div class="siren-glow"></div></div>
      <div class="entity rigged" id="heist-cop" style="aspect-ratio:1">
        <canvas id="canvas-heist-cop" width="512" height="512"></canvas>
        <img id="img-heist-cop" alt="שוטרת" style="display:none">
      </div>
      <div class="entity idle" id="heist-k9"><img id="img-heist-k9" alt="כלב"></div>
      <div class="entity walking" id="heist-thief"><img id="img-heist-thief" alt="גנב"></div>
      <div class="prop" id="heist-bag"><img id="img-heist-bag" alt="שק יהלומים"></div>
      <div id="heist-gems-layer"></div>
      <div id="heist-cuffs-btn" title="עצור!"><img id="img-heist-cuffs" alt="אזיקים"></div>
      <div class="heist-action-bar">
        <button class="action-fab" id="btn-k9-go" title="שלח את הכלב">🐾</button>
        <button class="action-fab" id="btn-siren-go" style="background:linear-gradient(180deg,#59b6ff 0%,#1f6bd6 100%)" title="סירנה">🚨</button>
      </div>
    </div>

    <!-- ================= SCENE 3: MUGSHOT & WANTED BOARD ================= -->
    <div id="scene-mugshot" class="scene">

// Preload all rig images + holdable prop images
const rigImgs = {};
Object.entries(RIG_URIS).forEach(([k, uri]) => { const im = new Image(); im.src = uri; rigImgs[k] = im; });
const propImgs = {};
['donuts','tray','cuffs'].forEach(k => { const im = new Image(); im.src = ASSETS[k]; propImgs[k] = im; });

// ================= REAL 18-PART HIERARCHICAL 2D SKELETAL RIG ENGINE (cop_male_rig_v2) =================
class CopRigRenderer {
  constructor(canvas){
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.mode = 'idle'; // idle | walk | wave | drag
    this.heldProp = null; // null | 'donuts' | 'tray' | 'cuffs'
    this.waveUntil = 0;
    this.cur = Object.assign({}, RIG_SPEC.rest_angles_deg || {});
    this.curLift = 0;
    this.curBob = 0;
    this.curSway = 0;
    this.lastNow = 0;
  }
  triggerWave(ms=1600){
    this.waveUntil = performance.now() + ms;
  }
  draw(now){
    const ctx = this.ctx;
    ctx.clearRect(0, 0, 512, 512);
    if(!rigImgs.pelvis || !rigImgs.pelvis.complete || !rigImgs.torso || !rigImgs.torso.complete) return;

    const dt = this.lastNow ? Math.min(0.05, (now - this.lastNow) / 1000) : 0.016;
    this.lastNow = now;
    const t = now / 1000;
    const isWaving = this.mode === 'idle' && now < this.waveUntil;
    const mode = isWaving ? 'wave' : this.mode;
    const R = RIG_SPEC.rest_angles_deg;

    // Target joint angles (deg, + = CCW on screen, 0 = vertical straight down)
    const tgt = {
      pelvis: R.pelvis || 0,
      torso: R.torso || 0,
      head: R.head || 0,
      arm_l_upper: R.arm_l_upper || 8,
      arm_l_forearm: R.arm_l_forearm || 6,
      hand_l_open: R.hand_l_open || 0,
      arm_r_upper: R.arm_r_upper || -8,
      arm_r_forearm: R.arm_r_forearm || -6,
      hand_r: R.hand_r || 0,
      leg_l_thigh: R.leg_l_thigh || 8,
      leg_l_shin: R.leg_l_shin || -4,
      foot_l: R.foot_l || -4,
      leg_r_thigh: R.leg_r_thigh || -8,
      leg_r_shin: R.leg_r_shin || 4,
      foot_r: R.foot_r || 4,
    };

    let tgtBob = 0, tgtLift = 0, tgtSway = 0;
    let headKey = 'head_neutral';
    let rightHandKey = this.heldProp ? 'hand_r_grip' : 'hand_r_open';

    if(mode === 'idle'){
      const br = Math.sin(t * 2.6);
      tgtBob = br * 2.5;
      tgt.torso = br * 1.1;
      tgt.head = Math.sin(t * 2.6 - 0.5) * 1.8;
      tgt.arm_l_upper = 9 + br * 2.2;
      tgt.arm_l_forearm = 10 + br * 2.0;
      tgt.hand_l_open = 4 * br;
      if(this.heldProp){
        tgt.arm_r_upper = -18 + br * 1.5;
        tgt.arm_r_forearm = 62 + br * 2.0;
        tgt.hand_r = -10;
      } else {
        tgt.arm_r_upper = -9 - br * 2.0;
        tgt.arm_r_forearm = 8 + br * 1.8;
        tgt.hand_r = -3 * br;
      }
      tgt.leg_l_thigh = 7; tgt.leg_l_shin = -5; tgt.foot_l = -2;
      tgt.leg_r_thigh = -7; tgt.leg_r_shin = 3; tgt.foot_r = 4;
    } else if(mode === 'walk'){
      const p = t * 9.2;
      const pR = p, pL = p + Math.PI;
      // Right (front) leg stride with realistic knee bend & ankle roll
      tgt.leg_r_thigh = 26 * Math.sin(pR);
      tgt.leg_r_shin = -36 * Math.max(0, Math.cos(pR - 0.45)) - 4;
      tgt.foot_r = -(tgt.leg_r_thigh + tgt.leg_r_shin) * 0.72 + 10 * Math.max(0, -Math.sin(pR));
      // Left (back) leg stride
      tgt.leg_l_thigh = 26 * Math.sin(pL);
      tgt.leg_l_shin = -36 * Math.max(0, Math.cos(pL - 0.45)) - 4;
      tgt.foot_l = -(tgt.leg_l_thigh + tgt.leg_l_shin) * 0.72 + 10 * Math.max(0, -Math.sin(pL));
      // Pelvis bounce + forward lean
      tgtBob = -7 * Math.abs(Math.sin(p)) + 5;
      tgt.pelvis = 2.5 * Math.sin(p);
      tgt.torso = -4.5 + 2.0 * Math.sin(2 * p);
      tgt.head = 3.5 + 2.2 * Math.sin(2 * p + 0.5);
      // Counter-swinging arms with elbow bend
      tgt.arm_l_upper = 6 + 24 * Math.sin(pR);
      tgt.arm_l_forearm = 24 + 16 * Math.max(0, Math.sin(pR + 0.3));
      tgt.hand_l_open = 6 * Math.sin(pR - 0.4);
      if(this.heldProp){
        tgt.arm_r_upper = -14 + 6 * Math.sin(pL);
        tgt.arm_r_forearm = 64 + 6 * Math.sin(2 * p);
        tgt.hand_r = -12;
      } else {
        tgt.arm_r_upper = -4 + 24 * Math.sin(pL);
        tgt.arm_r_forearm = 26 + 16 * Math.max(0, Math.sin(pL + 0.3));
        tgt.hand_r = 6 * Math.sin(pL - 0.4);
      }
      headKey = 'head_happy';
    } else if(mode === 'wave'){
      const w = Math.sin(t * 13);
      tgt.pelvis = 2;
      tgt.torso = 4 + 1.5 * Math.sin(t * 6.5);
      tgt.head = -5 + 2.5 * Math.sin(t * 6.5);
      // Left arm raised high, elbow & wrist waving with follow-through
      tgt.arm_l_upper = 132 + 6 * Math.sin(t * 6.5);
      tgt.arm_l_forearm = 22 + 28 * w;
      tgt.hand_l_open = 16 * Math.sin(t * 13 - 0.6);
      if(this.heldProp){
        tgt.arm_r_upper = -18; tgt.arm_r_forearm = 62; tgt.hand_r = -10;
      } else {
        tgt.arm_r_upper = -12; tgt.arm_r_forearm = 14; tgt.hand_r = 0;
      }
      tgt.leg_l_thigh = 7; tgt.leg_l_shin = -5; tgt.foot_l = -2;
      tgt.leg_r_thigh = -7; tgt.leg_r_shin = 3; tgt.foot_r = 4;
      headKey = 'head_happy';
    } else if(mode === 'drag'){
      tgtLift = 24;
      tgtSway = 8.5 * Math.sin(t * 5.4);
      const k = t * 14.5;
      tgt.pelvis = 6 * Math.sin(t * 5.4 - 0.3);
      tgt.torso = 4 * Math.sin(t * 5.4 - 0.15);
      tgt.head = -tgtSway * 0.45;
      // Flailing arms with bent elbows
      tgt.arm_l_upper = 136 + 14 * Math.sin(t * 9.5);
      tgt.arm_l_forearm = 28 + 20 * Math.sin(t * 9.5 - 0.7);
      tgt.hand_l_open = 14 * Math.sin(t * 9.5 - 1.2);
      tgt.arm_r_upper = -118 - 14 * Math.sin(t * 9.5);
      tgt.arm_r_forearm = -24 - 18 * Math.sin(t * 9.5 - 0.7);
      tgt.hand_r = -12 * Math.sin(t * 9.5 - 1.2);
      // Kicking legs with knee & ankle lag
      tgt.leg_l_thigh = 26 * Math.sin(k);
      tgt.leg_l_shin = -26 + 24 * Math.sin(k - 0.85);
      tgt.foot_l = -18 + 18 * Math.sin(k - 1.4);
      tgt.leg_r_thigh = -26 * Math.sin(k);
      tgt.leg_r_shin = -26 - 24 * Math.sin(k - 0.85);
      tgt.foot_r = -18 - 18 * Math.sin(k - 1.4);
      headKey = 'head_alert';
    }

    // Smooth exponential interpolation so state changes never pop
    const alpha = Math.min(1, dt * 16);
    for(const k in tgt){
      const prev = (this.cur[k] !== undefined) ? this.cur[k] : tgt[k];
      this.cur[k] = prev + (tgt[k] - prev) * alpha;
    }
    this.curBob += (tgtBob - this.curBob) * alpha;
    this.curLift += (tgtLift - this.curLift) * alpha;
    this.curSway += (tgtSway - this.curSway) * alpha;

    const P = RIG_SPEC.parts;
    const toRad = deg => -deg * Math.PI / 180; // rig_spec: +deg is CCW; canvas: +rad is CW
    const [rx0, ry0] = RIG_SPEC.root_xy_idle || [256, 274.6];

    // Forward Kinematics: compute world {x, y, deg} for every bone in hierarchy
    const world = {};
    const attach = (name, parentName, socketName, localDeg) => {
      const par = world[parentName];
      const pMeta = P[parentName];
      const sock = pMeta.sockets[socketName];
      const lx = sock[0] - pMeta.pivot[0];
      const ly = sock[1] - pMeta.pivot[1];
      const r = toRad(par.deg);
      const c = Math.cos(r), s = Math.sin(r);
      world[name] = {
        x: par.x + lx * c - ly * s,
        y: par.y + lx * s + ly * c,
        deg: par.deg + localDeg
      };
    };

    world.pelvis = { x: rx0, y: ry0 + this.curBob - this.curLift, deg: this.cur.pelvis };
    attach('torso', 'pelvis', 'waist', this.cur.torso);
    attach('head', 'torso', 'neck', this.cur.head);

    attach('arm_l_upper', 'torso', 'shoulder_l', this.cur.arm_l_upper);
    attach('arm_l_forearm', 'arm_l_upper', 'elbow', this.cur.arm_l_forearm);
    attach('hand_l_open', 'arm_l_forearm', 'wrist', this.cur.hand_l_open);

    attach('arm_r_upper', 'torso', 'shoulder_r', this.cur.arm_r_upper);
    attach('arm_r_forearm', 'arm_r_upper', 'elbow', this.cur.arm_r_forearm);
    attach('hand_r', 'arm_r_forearm', 'wrist', this.cur.hand_r);

    attach('leg_l_thigh', 'pelvis', 'hip_l', this.cur.leg_l_thigh);
    attach('leg_l_shin', 'leg_l_thigh', 'knee', this.cur.leg_l_shin);
    attach('foot_l', 'leg_l_shin', 'ankle', this.cur.foot_l);

    attach('leg_r_thigh', 'pelvis', 'hip_r', this.cur.leg_r_thigh);
    attach('leg_r_shin', 'leg_r_thigh', 'knee', this.cur.leg_r_shin);
    attach('foot_r', 'leg_r_shin', 'ankle', this.cur.foot_r);

    const drawPart = (imgKey, boneName) => {
      const img = rigImgs[imgKey];
      const meta = P[imgKey];
      const w = world[boneName];
      if(!img || !img.complete || !meta || !w) return;
      ctx.save();
      ctx.translate(w.x, w.y);
      ctx.rotate(toRad(w.deg));
      ctx.drawImage(img, -meta.pivot[0], -meta.pivot[1]);
      ctx.restore();
    };

    const drawHeldProp = () => {
      if(!this.heldProp || !propImgs[this.heldProp]?.complete) return;
      const meta = P[rightHandKey];
      const w = world.hand_r;
      const hs = meta.hand_socket;
      const lx = hs[0] - meta.pivot[0];
      const ly = hs[1] - meta.pivot[1];
      const r = toRad(w.deg);
      const wx = w.x + lx * Math.cos(r) - ly * Math.sin(r);
      const wy = w.y + lx * Math.sin(r) + ly * Math.cos(r);
      ctx.save();
      ctx.translate(wx, wy);
      ctx.rotate(toRad(w.deg * 0.25)); // keep prop mostly upright
      const psz = this.heldProp === 'cuffs' ? 84 : 104;
      ctx.drawImage(propImgs[this.heldProp], -psz/2 + 12, -psz/2 - 6, psz, psz);
      ctx.restore();
    };

    ctx.save();
    if(Math.abs(this.curSway) > 0.1){
      ctx.translate(256, 175);
      ctx.rotate(toRad(this.curSway));
      ctx.translate(-256, -175);
    }

    // Exact z_order from rig_spec.json v3 (back -> front: hands under forearms, legs under pelvis, prop in front)
    // marker: cop_male_rig_v3
    drawPart('arm_l_upper', 'arm_l_upper');
    drawPart('hand_l_open', 'hand_l_open');
    drawPart('arm_l_forearm', 'arm_l_forearm');
    drawPart('leg_l_thigh', 'leg_l_thigh');
    drawPart('leg_l_shin', 'leg_l_shin');
    drawPart('foot_l', 'foot_l');
    drawPart('leg_r_thigh', 'leg_r_thigh');
    drawPart('leg_r_shin', 'leg_r_shin');
    drawPart('foot_r', 'foot_r');
    drawPart('pelvis', 'pelvis');
    drawPart('torso', 'torso');
    drawPart(headKey, 'head');
    drawPart('arm_r_upper', 'arm_r_upper');
    drawPart(rightHandKey, 'hand_r');
    drawPart('arm_r_forearm', 'arm_r_forearm');
    drawHeldProp();

    ctx.restore();
  }
}

let actx = null;
function beep(freq, dur=0.1, type='sine', vol=0.14, slide=null){
  if(!state.sfx) return;
  try {
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide, actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch(e){}
}

function walkEntityTo(ent, targetX, targetY, floor){
  if(ent.timer) cancelAnimationFrame(ent.timer);
  const startX = ent.x, startY = ent.y;
  const dx = targetX - startX, dy = targetY - startY;
  const dist = Math.hypot(dx, dy);
  if(dist < 1.5) return;
  const dur = Math.min(1150, Math.max(300, dist * 16));
  const t0 = performance.now();
  ent.el.classList.remove('idle','landed');
  if(ent.rig){
    ent.rig.mode = 'walk';
  } else {
    ent.el.classList.add('walking');
  }
  ent.el.classList.toggle('flip', dx < -0.5);
  let lastStep = 0;
  function step(now){
    const p = Math.min(1, (now - t0) / dur);
    const ease = p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
    ent.x = startX + dx * ease;
    ent.y = startY + dy * ease;
    ent.el.style.left = ent.x + '%';
    ent.el.style.top = ent.y + '%';
    const beat = Math.floor((now - t0) / 160);
    if(beat !== lastStep){
      lastStep = beat;
      if(!ent.rig && ent.img) ent.img.src = ASSETS[(beat % 2) ? ent.walk : ent.idle];
      sfxStep();
    }
    if(p < 1){
      ent.timer = requestAnimationFrame(step);
    } else {
      ent.timer = null;
      ent.floor = floor;
      if(ent.rig){
        ent.rig.mode = 'idle';
      } else {
        if(ent.img) ent.img.src = ASSETS[ent.idle];
        ent.el.classList.remove('walking');
        ent.el.classList.add('idle');
      }
    }
  }
  ent.timer = requestAnimationFrame(step);
}

    sfxDing();
    spawnFx(hqCam, 20.5, floor === 2 ? 52 : 76, '✨');
    hero.x = 20.5; hero.y = yPct; hero.floor = floor;
    hero.el.style.left = hero.x + '%'; hero.el.style.top = hero.y + '%';
  }
  walkEntityTo(hero, xPct, yPct, floor);

    const k9Target = Math.max(8, Math.min(92, xPct + (xPct > 50 ? -9 : 9)));

}

function makeDraggable(el, opts={}){
  let dragging = false, moved = false, sx = 0, sy = 0;
  el.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY;
    el.setPointerCapture(e.pointerId);
    if(opts.entity && opts.entity.timer){ cancelAnimationFrame(opts.entity.timer); opts.entity.timer = null; }
  });
  el.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    if(!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 7){
      moved = true;
      el.classList.add('dragging');
      el.classList.remove('idle','walking');
      if(opts.entity?.rig) opts.entity.rig.mode = 'drag';
      sfxPop();
    }
    if(!moved) return;
    const rect = hqCam.getBoundingClientRect();
    const xPct = Math.max(5, Math.min(95, ((e.clientX - rect.left) / rect.width) * 100));
    const yPct = Math.max(18, Math.min(96, ((e.clientY - rect.top) / rect.height) * 100));
    el.style.left = xPct + '%';
    el.style.top = yPct + '%';
  });
  el.addEventListener('pointerup', (e) => {
    if(!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    if(!moved){
      if(opts.entity?.rig) opts.entity.rig.mode = 'idle';
      if(opts.onTap) opts.onTap();
      return;
    }
    sfxDrop();
    const rect = hqCam.getBoundingClientRect();
    const xPct = Math.max(6, Math.min(94, ((e.clientX - rect.left) / rect.width) * 100));
    const yPct = Math.max(20, Math.min(95, ((e.clientY - rect.top) / rect.height) * 100));
    if(opts.entity){
      const floor = yPct < 68 ? 2 : 1;
      const snapY = floor === 2 ? 61 : 92;
      opts.entity.x = xPct; opts.entity.y = snapY; opts.entity.floor = floor;
      el.style.left = xPct + '%'; el.style.top = snapY + '%';
      if(opts.entity.rig){
        opts.entity.rig.mode = 'idle';
        // If holding food/donuts and dropped near a prisoner cell, feed them!
        if(opts.entity.rig.heldProp && floor === 2){
          for(let i=0;i<3;i++){
            if(Math.abs(xPct - CELL_X[i]) < 8 && state.caught.some(id => VILLAINS.find(v=>v.id===id)?.cell === i)){
              spawnFx(hqCam, CELL_X[i], 45, '😋');
              opts.entity.rig.heldProp = null;
              sfxDing();
              break;
            }
          }
        }
      } else {
        el.classList.add('idle');
      }
      el.classList.add('landed');
      setTimeout(()=>el.classList.remove('landed'), 340);
    } else if(opts.onDropProp){
      opts.onDropProp(xPct, yPct, el);
    }
  });
}

function handleFoodDrop(xPct, yPct, el, propKey, emoji){
  // Dropped on Rigged Cop -> Cop HOLDS IT IN HAND!
  if(Math.abs(xPct - copM.x) < 10 && Math.abs(yPct - (copM.y - 10)) < 16){
    hqCopRig.heldProp = propKey;
    hqCopRig.triggerWave(900);
    sfxDing();
    spawnFx(hqCam, copM.x, copM.y - 18, emoji);
    el.style.left = el.id === 'prop-donuts' ? '50.5%' : '75.5%';
    el.style.top  = el.id === 'prop-donuts' ? '83.5%' : '91.5%';
    return;
  }
  for(let i=0;i<3;i++){
    if(Math.abs(xPct - CELL_X[i]) < 7.5 && yPct > 36 && yPct < 66){
      const v = VILLAINS.find(vv => vv.cell === i && state.caught.includes(vv.id));
      if(v){
        spawnFx(hqCam, CELL_X[i], 46, '😋');
        setTimeout(()=>spawnFx(hqCam, CELL_X[i]+2, 42, '❤️'), 120);
        sfxDing();
        el.style.left = el.id === 'prop-donuts' ? '50.5%' : '75.5%';
        el.style.top  = el.id === 'prop-donuts' ? '83.5%' : '91.5%';
        return;
      }
    }
  }
  [copF, k9].forEach(ent => {
    if(Math.abs(xPct - ent.x) < 9 && Math.abs(yPct - (ent.y - 8)) < 14){
      spawnFx(hqCam, ent.x, ent.y - 16, emoji); sfxPop();
    }
  });
}

// ================= SCENE 2: OUTDOOR HEIST =================
let activeVillain = VILLAINS[0];
let heistTimer = null, heistThiefX = 76, heistDir = -1, heistStunned = false, gemsLeft = 0;

function syncHeistCopVisual(){
  const isM = state.activeCop === 'm';
  document.getElementById('canvas-heist-cop').style.display = isM ? 'block' : 'none';
  document.getElementById('img-heist-cop').style.display = isM ? 'none' : 'block';
  document.getElementById('img-heist-cop').src = ASSETS['cop_f_idle'];
  heistCopRig.mode = 'idle';
  heistCopRig.heldProp = 'cuffs';
}

function startHeist(forceVillain){
  setJailZoom(false);
  activeVillain = (forceVillain && forceVillain.id) ? forceVillain : (getNextVillain() || VILLAINS[Math.floor(Math.random()*VILLAINS.length)]);
  heistStunned = false; heistThiefX = 78; heistDir = -1;
  document.getElementById('heist-pill').textContent = `🚨 ${activeVillain.name} — ${activeVillain.heistHint}`;
  syncHeistCopVisual();
  document.getElementById('img-heist-thief').src = ASSETS[activeVillain.run];
  document.getElementById('img-heist-k9').src = ASSETS['k9_idle'];
  document.getElementById('heist-cop').style.left = '34%';
  document.getElementById('heist-k9').style.left = '26%';
  document.getElementById('heist-bag').style.display = activeVillain.id === 'sci' ? 'none' : 'block';

  const gemsLayer = document.getElementById('heist-gems-layer');
  gemsLayer.innerHTML = '';
  gemsLeft = activeVillain.id === 'gem' ? 3 : 0;
  if(gemsLeft > 0){
    [[44,77],[58,83],[70,79]].forEach(([gx,gy]) => {
      const g = document.createElement('div');
      g.className = 'dropped-gem';
      g.style.left = gx+'%'; g.style.top = gy+'%';
      g.innerHTML = '<svg viewBox="0 0 64 64"><polygon points="32,6 56,24 32,58 8,24" fill="#4ce8ff" stroke="#fff" stroke-width="4"/><polygon points="32,6 44,24 32,58 20,24" fill="#a8f5ff"/></svg>';
      g.addEventListener('click', () => {
        g.remove(); gemsLeft--; sfxDing();
        spawnFx(scenes.heist, gx, gy-4, '💎');
        updateHeistCuffs();
      });
      gemsLayer.appendChild(g);
    });
  }
  updateHeistCuffs();
  showScene('heist');
  sfxSiren();
  if(heistTimer) cancelAnimationFrame(heistTimer);
  let last = performance.now();
  function loop(now){
    if(curScene !== 'heist') return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if(!heistStunned){
      heistThiefX += heistDir * 17 * dt;
      if(heistThiefX < 56){ heistThiefX = 56; heistDir = 1; }
      if(heistThiefX > 88){ heistThiefX = 88; heistDir = -1; }
      const th = document.getElementById('heist-thief');
      th.style.left = heistThiefX + '%';
      th.classList.toggle('flip', heistDir < 0);
      document.getElementById('heist-bag').style.left = (heistThiefX + (heistDir < 0 ? 5 : -5)) + '%';
    }
    heistTimer = requestAnimationFrame(loop);
  }
  heistTimer = requestAnimationFrame(loop);
}

function updateHeistCuffs(){
  const btn = document.getElementById('heist-cuffs-btn');
  const ready = (gemsLeft === 0) && (heistStunned || activeVillain.id === 'gem');
  btn.classList.toggle('locked', !ready);
}

function stunThiefWithK9(){
  const k9el = document.getElementById('heist-k9');
  document.getElementById('img-heist-k9').src = ASSETS['k9_run'];
  k9el.style.transition = 'left .45s ease-out';
  k9el.style.left = (heistThiefX - 13) + '%';
  sfxBark();
  spawnFx(scenes.heist, heistThiefX - 10, 72, '🐾');
  setTimeout(() => {
    heistStunned = true;
    document.getElementById('heist-thief').classList.remove('walking');
    document.getElementById('heist-thief').classList.add('idle');
    spawnFx(scenes.heist, heistThiefX, 66, '❗');
    updateHeistCuffs();
  }, 380);
}
function stunThiefWithSiren(){
  sfxSiren(); spawnFx(scenes.heist, 18, 66, '🚨');
  heistStunned = true;
  document.getElementById('heist-thief').classList.remove('walking');
  document.getElementById('heist-thief').classList.add('idle');
  spawnFx(scenes.heist, heistThiefX, 66, '😲');
  updateHeistCuffs();
}

document.getElementById('btn-siren-go').addEventListener('click', stunThiefWithSiren);

function arrestThief(){
  if(gemsLeft > 0){ spawnFx(scenes.heist, 56, 42, '💎'); sfxPop(); return; }
  heistStunned = true;
  const copEl = document.getElementById('heist-cop');
  if(state.activeCop === 'm') heistCopRig.mode = 'walk';
  else document.getElementById('img-heist-cop').src = ASSETS['cop_f_walk'];
  copEl.style.transition = 'left .46s ease-out';
  copEl.style.left = (heistThiefX - 10) + '%';
  sfxDing(); spawnFx(scenes.heist, heistThiefX, 62, '⭐');
  setTimeout(() => {
    heistCopRig.mode = 'idle';
    copEl.style.transition = '';
    if(!state.caught.includes(activeVillain.id)){
      state.caught.push(activeVillain.id); saveState();
    }
    openWantedBoard(activeVillain);
  }, 540);
}
document.getElementById('heist-cuffs-btn').addEventListener('click', arrestThief);
document.getElementById('heist-thief').addEventListener('click', () => {
  if(!heistStunned) stunThiefWithK9(); else arrestThief();
});

// ================= SCENE 3: MUGSHOT & WANTED BOARD =================
const BOARD_SLOTS = [{x:64.2,y:37,r:-4},{x:74.5,y:36.5,r:2},{x:84.8,y:37.5,r:-2}];
let pendingSnapVillain = null;

function openWantedBoard(capturedVillain){
  pendingSnapVillain = capturedVillain;
  const showV = capturedVillain || VILLAINS.find(v => state.caught.includes(v.id)) || VILLAINS[0];
  document.getElementById('img-mug-thief').src = ASSETS[showV.jail];
  const isM = state.activeCop === 'm';
  document.getElementById('canvas-mug-cop').style.display = isM ? 'block' : 'none';
  document.getElementById('img-mug-cop').style.display = isM ? 'none' : 'block';
  document.getElementById('img-mug-cop').src = ASSETS['cop_f_idle'];
  mugCopRig.heldProp = null;
  mugCopRig.triggerWave(1800);
  document.getElementById('mug-thief').style.opacity = capturedVillain ? '1' : '0.01';
  document.getElementById('mug-cam-btn').style.display = capturedVillain ? 'flex' : 'none';
  document.getElementById('mug-done-btn').style.display = capturedVillain ? 'none' : 'flex';
  renderWantedSlots(capturedVillain ? capturedVillain.id : null);
  showScene('mugshot');
}

function renderWantedSlots(hideId){
  const wrap = document.getElementById('wanted-board-slots');
  wrap.innerHTML = '';
  VILLAINS.forEach((v, idx) => {
    const slot = BOARD_SLOTS[idx];
    const caught = state.caught.includes(v.id) && v.id !== hideId;
    const card = document.createElement('div');
    card.className = 'polaroid' + (caught ? '' : ' empty');
    card.style.left = slot.x + '%'; card.style.top = slot.y + '%';
    card.style.setProperty('--rot', slot.r + 'deg');
    card.innerHTML = `<div class="pin"></div><div class="pic">${caught ? `<img src="${ASSETS[v.jail]}" alt="${v.name}">` : ''}</div><div class="lbl">${caught ? v.name : 'מבוקש'}</div>`;
    card.addEventListener('click', () => {
      if(!caught) startHeist(v);
      else { sfxPop(); spawnFx(scenes.mugshot, slot.x, slot.y-8, v.emoji); }
    });
    wrap.appendChild(card);
  });
}

document.getElementById('mug-cam-btn').addEventListener('click', () => {
  if(!pendingSnapVillain) return;
  const v = pendingSnapVillain;
  pendingSnapVillain = null;
  document.getElementById('mug-cam-btn').style.display = 'none';
  const flash = document.getElementById('mug-flash');
  flash.style.opacity = '0.95'; sfxShutter();
  mugCopRig.triggerWave(2200);
  setTimeout(()=>{ flash.style.opacity = '0'; }, 120);

  const slot = BOARD_SLOTS[v.cell];
  const fly = document.createElement('div');
  fly.className = 'polaroid';
  fly.style.left = '24%'; fly.style.top = '50%'; fly.style.width = '14%';
  fly.innerHTML = `<div class="pin"></div><div class="pic"><img src="${ASSETS[v.jail]}" alt="${v.name}"></div><div class="lbl">${v.name}</div>`;
  scenes.mugshot.appendChild(fly);
  requestAnimationFrame(() => {
    fly.style.left = slot.x + '%'; fly.style.top = slot.y + '%';
    fly.style.width = '9.2%'; fly.style.setProperty('--rot', slot.r + 'deg');
  });
  for(let k=0;k<6;k++){
    setTimeout(()=>spawnFx(scenes.mugshot, 18 + k*11, 30 + (k%3)*12, ['⭐','🎉','✨'][k%3]), k*70);
  }
  setTimeout(() => {
    fly.remove(); renderWantedSlots(null);
    document.getElementById('mug-done-btn').style.display = 'flex';
  }, 700);
});
