<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fitness Timer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F2F7">
<!-- Tailwind used to be a just-in-time compiler pulled from cdn.tailwindcss.com
     on every launch. It is now a stylesheet built ahead of time from the same
     theme, so the app needs nothing from the network to render. Rebuild it
     after changing classes in app.jsx or here - see vendor/README.md. -->
<link rel="stylesheet" href="vendor/tailwind.css">
<style>
  html, body { background: #F2F2F7; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
    touch-action: manipulation;
  }
  * { box-sizing: border-box; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  .progress-ring-fg { transition: stroke-dashoffset 0.2s linear, stroke 0.3s ease; }
  ::selection { background: #007AFF33; }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Neither iOS Safari nor a plain (non-fullscreen) browser tab honors the
     manifest's "orientation": "portrait" or the Screen Orientation Lock
     API, so a real lock only works for an Android PWA launched from the
     home screen. Everywhere else, this landscape overlay is the fallback:
     it blocks the scrambled landscape layout and asks for portrait back,
     which is what "locked to portrait" has to mean on those platforms. */
  /* An id selector, so that the display-setting utility classes on these
     overlays cannot out-rank it and leave an invisible sheet of glass over
     the whole app, swallowing every tap. Showing them sets display inline,
     which out-ranks both. */
  #crash { display: none; }
  #rotate-lock { display: none; }
  @media (orientation: landscape) {
    #root { display: none; }
    #rotate-lock { display: flex; }
  }
</style>
</head>
<body class="bg-iosbg text-ioslabel font-sf">
<div id="root"></div>

<div id="crash" class="fixed inset-0 z-[1000] flex flex-col items-center justify-center gap-3 bg-iosbg px-8 text-center">
  <div class="text-[17px] font-semibold text-ioslabel">The app didn't start</div>
  <div id="crash-what" class="text-[13px] text-iossecondary break-words max-w-full"></div>
  <div id="crash-build" class="text-[11px] text-iossecondary"></div>
  <button onclick="location.reload()" class="mt-2 px-5 py-2.5 rounded-full bg-iosblue text-white font-medium text-[14px]">Reload</button>
</div>

<script>
  // Every failure in this app used to look the same from the outside: a
  // blank white screen, indistinguishable from a slow load, a stale copy or
  // a dead network - and impossible to report as anything but "it doesn't
  // work". Now whatever goes wrong puts its own message on screen, along
  // with which build it happened on.
  (function () {
    var shown = false;
    function show(what) {
      if (shown) return;
      shown = true;
      var panel = document.getElementById('crash');
      if (!panel) return;
      document.getElementById('crash-what').textContent = what;
      document.getElementById('crash-build').textContent = 'build ' + (window.__BUILD__ || 'unknown');
      panel.style.display = 'flex';
    }
    window.__appCrash = show;
    window.addEventListener('error', function (e) {
      show((e.message || 'Script error') +
        (e.filename ? ' \u2014 ' + String(e.filename).split('/').pop() + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      show('Unhandled: ' + ((e.reason && e.reason.message) || e.reason));
    });
    // A silent failure leaves exactly as blank a screen as a loud one, so
    // treat "nothing has been drawn" as a failure in its own right.
    setTimeout(function () {
      var root = document.getElementById('root');
      if (!root || root.children.length === 0) show('Nothing was drawn within 10 seconds.');
    }, 10000);
  })();
</script>

<div id="rotate-lock" class="fixed inset-0 z-[999] flex-col items-center justify-center gap-4 bg-iosbg px-10 text-center">
  <svg viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-12 h-12" style="animation: rotate-hint 1.8s ease-in-out infinite;">
    <rect x="6" y="3" width="12" height="18" rx="2.2" />
    <path d="M12 17.5h.01" />
  </svg>
  <div class="text-[17px] font-semibold text-ioslabel">Rotate back to portrait</div>
  <div class="text-[13px] text-iossecondary">This app is designed for portrait use only.</div>
</div>
<style>
  @keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
  }
</style>

<script>
  // Real lock where the platform actually supports it (Android PWA running
  // standalone/fullscreen); everywhere else this silently no-ops and the
  // CSS overlay above is what actually keeps the app usable in portrait.
  function tryLockPortrait() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(function () {});
    }
  }
  tryLockPortrait();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') tryLockPortrait();
  });
</script>

<script>
  // Belt-and-suspenders pinch/double-tap zoom lock: the viewport meta tag
  // above doesn't reliably block pinch on every engine, so also swallow the
  // gesture events directly (iOS Safari) and the classic double-tap-zoom
  // (any engine). Listeners must be non-passive for preventDefault() to work.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
    document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
  });
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
</script>

<!-- Every library the app needs, served from the project itself. Loading
     these from a CDN meant a dead CDN, a blocked domain or a gym basement
     with no signal was a blank screen: nothing here is optional, and React
     or Babel failing to arrive stops the app before it renders anything. -->
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/confetti.js"></script>
<script src="vendor/sortable.js"></script>

<!-- app.js is compiled from app.jsx by build.js. It used to be compiled here
     in the browser on every launch, which cost 1.4s on a laptop and 4.9s on
     a phone with an older processor before anything was drawn at all. After
     changing app.jsx, run: node build.js -->
<script src="app.js"></script>
</body>
</html>
