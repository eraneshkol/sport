<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fitness Timer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F2F7">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sf: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"Segoe UI"', 'Roboto', 'sans-serif'],
        },
        colors: {
          iosbg: '#F2F2F7',
          ioscard: '#FFFFFF',
          iosblue: '#007AFF',
          iosgreen: '#34C759',
          iosred: '#FF3B30',
          iosorange: '#FF9500',
          iossecondary: '#8E8E93',
          iosseparator: '#E5E5EA',
          ioslabel: '#1C1C1E',
        },
      },
    },
  };
</script>
<style>
  html, body { background: #F2F2F7; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
    touch-action: manipulation;
  }
  * { box-sizing: border-box; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  .progress-ring-fg { transition: stroke-dashoffset 0.2s linear, stroke 0.3s ease; }
  ::selection { background: #007AFF33; }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Neither iOS Safari nor a plain (non-fullscreen) browser tab honors the
     manifest's "orientation": "portrait" or the Screen Orientation Lock
     API, so a real lock only works for an Android PWA launched from the
     home screen. Everywhere else, this landscape overlay is the fallback:
     it blocks the scrambled landscape layout and asks for portrait back,
     which is what "locked to portrait" has to mean on those platforms. */
  #rotate-lock { display: none; }
  @media (orientation: landscape) {
    #root { display: none; }
    #rotate-lock { display: flex; }
  }
</style>
</head>
<body class="bg-iosbg text-ioslabel font-sf">
<div id="root"></div>

<div id="rotate-lock" class="fixed inset-0 z-[999] flex-col items-center justify-center gap-4 bg-iosbg px-10 text-center">
  <svg viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-12 h-12" style="animation: rotate-hint 1.8s ease-in-out infinite;">
    <rect x="6" y="3" width="12" height="18" rx="2.2" />
    <path d="M12 17.5h.01" />
  </svg>
  <div class="text-[17px] font-semibold text-ioslabel">Rotate back to portrait</div>
  <div class="text-[13px] text-iossecondary">This app is designed for portrait use only.</div>
</div>
<style>
  @keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
  }
</style>

<script>
  // Real lock where the platform actually supports it (Android PWA running
  // standalone/fullscreen); everywhere else this silently no-ops and the
  // CSS overlay above is what actually keeps the app usable in portrait.
  function tryLockPortrait() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(function () {});
    }
  }
  tryLockPortrait();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') tryLockPortrait();
  });
</script>

<script>
  // Belt-and-suspenders pinch/double-tap zoom lock: the viewport meta tag
  // above doesn't reliably block pinch on every engine, so also swallow the
  // gesture events directly (iOS Safari) and the classic double-tap-zoom
  // (any engine). Listeners must be non-passive for preventDefault() to work.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
    document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
  });
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
</script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
  fetch('app.jsx', { cache: 'no-store' })
    .then(r => r.text())
    .then(code => {
      const output = Babel.transform(code, {
        presets: [['react', { runtime: 'classic' }]],
        filename: 'app.jsx',
      }).code;
      const script = document.createElement('script');
      script.textContent = output;
      document.body.appendChild(script);
    })
    .catch(err => {
      document.getElementById('root').textContent = 'Failed to load app: ' + err.message;
      console.error(err);
    });
</script>
</body>
</html>
