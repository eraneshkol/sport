<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness Timer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F2F7">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sf: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"Segoe UI"', 'Roboto', 'sans-serif'],
        },
        colors: {
          iosbg: '#F2F2F7',
          ioscard: '#FFFFFF',
          iosblue: '#007AFF',
          iosgreen: '#34C759',
          iosred: '#FF3B30',
          iosorange: '#FF9500',
          iossecondary: '#8E8E93',
          iosseparator: '#E5E5EA',
          ioslabel: '#1C1C1E',
        },
      },
    },
  };
</script>
<style>
  html, body { background: #F2F2F7; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  * { box-sizing: border-box; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  .progress-ring-fg { transition: stroke-dashoffset 0.2s linear, stroke 0.3s ease; }
  ::selection { background: #007AFF33; }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-iosbg text-ioslabel font-sf">
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
  fetch('app.jsx', { cache: 'no-store' })
    .then(r => r.text())
    .then(code => {
      const output = Babel.transform(code, {
        presets: [['react', { runtime: 'classic' }]],
        filename: 'app.jsx',
      }).code;
      const script = document.createElement('script');
      script.textContent = output;
      document.body.appendChild(script);
    })
    .catch(err => {
      document.getElementById('root').textContent = 'Failed to load app: ' + err.message;
      console.error(err);
    });
</script>
</body>
</html>
